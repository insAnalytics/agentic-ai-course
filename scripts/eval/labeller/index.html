<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading the runs</title>
<!--
  Module 7, Lesson 3: the labelling page (see ../README-labeller.md). Run from the repo root:
      python -m http.server
  then open http://localhost:8000/scripts/eval/labeller/
  It loads only the reading sample's two files, and never shows a trial's grade, batch or trial number.

  Module 7, Lesson 7: the judge mode (see ../README-judge-labelling.md), opened with ?mode=judges, or
  ?mode=judges-relabel for the relabelling pass. It loads only public/data/eval/judge-labels/items.json, never a
  judge file, and never shows an item's stratum, split or id.
-->
<style>
  :root {
    --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e2dfd8;
    --accent: #2f5d8a; --accent-ink: #ffffff; --soft: #f1efe9; --error: #b3261e; --error-soft: #fbe9e7;
    --user: #eef3f8; --sim: #f4eefa; --ok: #2e7d32; --warn: #a15c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a3a29c; --line: #34332f;
      --accent: #7fb0e0; --accent-ink: #10202f; --soft: #262624; --error: #f28b82; --error-soft: #3a1f1d;
      --user: #1e2a36; --sim: #2a2236; --ok: #81c995; --warn: #f0b35a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
           display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header .spacer { flex: 1; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  button, select { font: inherit; color: inherit; background: var(--soft); border: 1px solid var(--line);
                   border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 12px 0; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .title { font-size: 19px; font-weight: 600; margin: 0; }
  .title code { font-size: 18px; }
  .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 99px; padding: 1px 9px; }
  .chip.fault { color: var(--warn); border-color: currentColor; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  pre { margin: 6px 0 0; padding: 8px 10px; background: var(--soft); border-radius: 6px; white-space: pre-wrap;
        overflow-wrap: anywhere; font: 13px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; max-height: 22em; overflow: auto; }
  .turn { border-left: 3px solid var(--line); padding: 6px 0 6px 12px; margin: 10px 0; }
  .turn.user { border-color: var(--accent); background: var(--user); border-radius: 0 6px 6px 0; padding-right: 10px; }
  .turn.sim { border-color: #8a5cc2; background: var(--sim); border-radius: 0 6px 6px 0; padding-right: 10px; }
  .turn.tool-result.is-error { border-color: var(--error); }
  .who { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; border-radius: 4px;
           padding: 0 6px; margin-left: 6px; vertical-align: 1px; }
  .badge.error { background: var(--error-soft); color: var(--error); border: 1px solid var(--error); }
  details > summary { cursor: pointer; color: var(--muted); }
  details.reasoning { margin: 4px 0; }
  details.reasoning[open] > summary { margin-bottom: 4px; }
  .call { margin-top: 6px; }
  .call .name { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
  .change { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .guide h1 { font-size: 18px; margin: 0 0 8px; }
  .guide h2 { font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 16px 0 6px; }
  .guide li { margin: 6px 0; }
  .guide table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .guide th, .guide td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
  .guide th { background: var(--soft); }
  .guide code, .fault-help code { font-size: 13px; }
  .fault-help { font-size: 13px; margin-top: 4px; }
  form label.opt { display: inline-flex; align-items: center; gap: 4px; margin-right: 14px; cursor: pointer; }
  form .field { margin: 10px 0; }
  form .field > .lbl { font-weight: 600; display: block; margin-bottom: 4px; }
  form .req { color: var(--error); font-weight: 400; font-size: 12px; }
  textarea { width: 100%; min-height: 4.5em; font: inherit; color: inherit; background: var(--bg);
             border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; }
  .status { font-size: 13px; }
  .status.done { color: var(--ok); }
  .status.todo { color: var(--warn); }
  .nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #loading { padding: 40px 0; text-align: center; }
  .verdicts { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
  .verdicts button { min-width: 7.5em; font-weight: 600; letter-spacing: .03em; }
  .verdicts button.chosen { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .verdicts kbd, .nav kbd { font: 11px ui-monospace, Consolas, monospace; opacity: .75; margin-left: 4px; }
  .warning { border-color: var(--warn); color: var(--warn); }
  pre.shown { max-height: 60vh; }
  pre.rubric { max-height: none; }
</style>
</head>
<body>
<header>
  <h1>Reading the runs</h1>
  <label>Reader <select id="reader"><option value="">choose…</option><option value="simar">simar</option><option value="claude">claude</option><option value="simar-review" disabled>simar (re-review)</option></select></label>
  <span id="progress" class="muted"></span>
  <span class="spacer"></span>
  <a href="#" id="guide-link">How to read</a>
  <button id="export" disabled>Export</button>
  <button id="import" disabled>Import</button>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</header>
<main>
  <div id="loading" class="muted">Loading the sample…</div>
  <section id="guide" class="card guide" hidden>
    <p class="muted">Loading the reading standard…</p>
  </section>
  <div id="trace"></div>
</main>

<script>
"use strict";
const DATA = "/public/data/eval/reading/";
const VERDICTS = ["pass", "fail", "unsure"];
const FAULTS = ["agent", "harness", "task", "simulated_user", "environment", "unclear"];
const FAULT_NAMES = {agent: "agent", harness: "harness", task: "task", simulated_user: "simulated user", environment: "environment",
                     unclear: "unclear"};
// as the reading standard (standard.md) describes them
const FAULT_HELP = {
  agent: "the model's own decision, given what it saw",
  harness: "the way the course built the agent: the system prompt, a tool's description, the checks, or a document planted in the corpus on purpose",
  task: "the request was ambiguous, or its expected outcome was wrong",
  simulated_user: "the simulated user broke its instructions",
  environment: "a tool or the world misbehaved in a way the task didn't intend",
  unclear: "say why in the note",
};
// the re-review pass: Simar's 40 again, prefilled from their first labels (labels-simar.json), exported as v2
const REVIEW = "simar-review";
const baseReader = (name) => name === REVIEW ? "simar" : name;
const DEFAULT_GROUPS = ["all-staff", "finance", "oncall", "security"];
const FAULT_TEXT = {lose_writes: "the write is lost", empty_agent: "the record comes back empty",
                    health_timeout: "the health service times out"};

let sample, traces, firstLabels = null, reader = null, index = 0, labels = {};
let shownAt = null;   // when the current trace's on-screen time started counting; null while hidden

// ---------- storage (every read and write guarded: the page still works without it) ----------
const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* not saved */ } },
};
const labelsKey = () => `labeller:v${sample.version}:${reader}:labels`;
const indexKey = () => `labeller:v${sample.version}:${reader}:index`;
function save() { store.set(labelsKey(), labels); store.set(indexKey(), index); }

// ---------- small DOM helper: text is always set as text, never parsed as HTML ----------
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const pretty = (value) => typeof value === "string" ? value : JSON.stringify(value, null, 2);
function prettyOutput(text) {
  // tool results are often JSON in a string; indent them so they're readable
  try { const parsed = JSON.parse(text); if (parsed && typeof parsed === "object") return JSON.stringify(parsed, null, 2); } catch {}
  return text;
}
const words = (text) => (text.trim().match(/\S+/g) || []).length;

// ---------- time on screen ----------
function flushTime() {
  if (shownAt == null || !reader) return;
  const id = currentId();
  const now = performance.now();
  const label = labelFor(id);
  label.seconds = (label.seconds || 0) + (now - shownAt) / 1000;
  shownAt = now;
  save();
}
function startTime() { shownAt = document.visibilityState === "visible" ? performance.now() : null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { flushTime(); shownAt = null; } else startTime();
});
window.addEventListener("pagehide", flushTime);
setInterval(() => { if (shownAt != null) flushTime(); }, 5000);

// ---------- labels ----------
const order = () => sample.order[baseReader(reader)];
const currentId = () => order()[index];
function labelFor(id) {
  return labels[id] ||= {verdict: null, first_failure: "", fault: null, how: "", reference_viewed: false, seconds: 0};
}
function missing(label) {
  if (!label || !label.verdict) return ["verdict"];
  if (label.verdict === "pass") return [];
  const out = [];
  if (!(label.first_failure || "").trim()) out.push("the first failure");
  if (!label.fault) out.push("whose fault");
  return out;
}
const isDone = (id) => missing(labels[id]).length === 0;

const norm = (value) => (typeof value === "string" ? value.trim() : value) || null;
function changedFromFirst(id) {
  const first = firstLabels[id], now = labels[id];
  return ["verdict", "first_failure", "fault", "how"].some((key) => norm(first[key]) !== norm(now[key]));
}
function prefillFromFirst() {
  for (const id of order()) {
    const first = firstLabels[id];
    if (labels[id] || !first) continue;
    labels[id] = {verdict: first.verdict, first_failure: first.first_failure || "", fault: first.fault || null,
                  how: first.how || "", reference_viewed: false, seconds: 0};
  }
}

function exportFile() {
  flushTime();
  const review = reader === REVIEW;
  const out = {reader: baseReader(reader), sample_version: sample.version,
               ...(review ? {pass: "re-review", review_of: "labels-simar.json"} : {}),
               labels: order().filter((id) => labels[id]).map((id) => {
    const l = labels[id];
    return {trial_id: id, verdict: l.verdict,
            first_failure: norm(l.first_failure),
            fault: l.fault || null,
            how: norm(l.how),
            reference_viewed: !!l.reference_viewed, seconds: Math.round(l.seconds || 0),
            ...(review ? {changed: changedFromFirst(id)} : {})};
  })};
  const blob = new Blob([JSON.stringify(out, null, 1) + "\n"], {type: "application/json"});
  const a = el("a", {href: URL.createObjectURL(blob), download: review ? "labels-simar-v2.json" : `labels-${reader}.json`});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { alert("That file isn't JSON."); return; }
  if (!data || !Array.isArray(data.labels) || !sample.order[data.reader]) { alert("That isn't a labels file from this page."); return; }
  if (data.sample_version !== sample.version) { alert(`That file is for sample version ${data.sample_version}; this sample is version ${sample.version}.`); return; }
  const known = new Set(sample.order[data.reader]);
  const unknown = data.labels.filter((l) => !known.has(l.trial_id));
  if (unknown.length) { alert(`${unknown.length} of its labels are for traces not in ${data.reader}'s list (first: ${unknown[0].trial_id}).`); return; }
  const target = data.review_of ? REVIEW : data.reader;
  if (data.review_of && data.reader !== "simar") { alert("Only Simar's labels have a re-review pass."); return; }
  if (target === REVIEW && !firstLabels) { alert("The re-review pass needs labels-simar.json, which didn't load."); return; }
  if (reader) flushTime();
  const existing = store.get(`labeller:v${sample.version}:${target}:labels`) || {};
  const overwritten = data.labels.filter((l) => existing[l.trial_id] && existing[l.trial_id].verdict).length;
  if (overwritten && !confirm(`Importing replaces ${overwritten} label(s) already saved in this browser for ${target}. Go ahead?`)) return;
  for (const l of data.labels) {
    existing[l.trial_id] = {verdict: VERDICTS.includes(l.verdict) ? l.verdict : null,
                            first_failure: l.first_failure || "", fault: FAULTS.includes(l.fault) ? l.fault : null,
                            how: l.how || "", reference_viewed: !!l.reference_viewed, seconds: Number(l.seconds) || 0};
  }
  store.set(`labeller:v${sample.version}:${target}:labels`, existing);
  // resume at the first trace without a complete label
  const firstOpen = sample.order[data.reader].findIndex((id) => missing(existing[id]).length);
  store.set(`labeller:v${sample.version}:${target}:index`, firstOpen === -1 ? 0 : firstOpen);
  shownAt = null;
  chooseReader(target);
}

// ---------- the reading standard: a small Markdown renderer (headings, paragraphs, lists, tables, **bold**,
// `code`) that builds DOM nodes, so nothing in the file is ever parsed as HTML ----------
function inline(text) {
  return text.split(/(\*\*[^*]+\*\*|`[^`]+`)/).filter(Boolean).map((part) =>
    part.startsWith("**") ? el("strong", {}, part.slice(2, -2)) : part.startsWith("`") ? el("code", {}, part.slice(1, -1)) : part);
}
function renderMarkdown(source) {
  const nodes = [];
  for (const block of source.replace(/\r\n/g, "\n").trim().split(/\n\s*\n/)) {
    const lines = block.split("\n");
    const heading = lines[0].match(/^(#{1,3})\s+(.*)$/);
    if (heading && lines.length === 1) {
      nodes.push(el(`h${heading[1].length}`, {}, inline(heading[2])));
    } else if (lines.every((line) => line.trim().startsWith("|"))) {
      const cells = (line) => line.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const rows = lines.filter((line) => !/^\s*\|?\s*:?-{3,}/.test(line)).map(cells);
      nodes.push(el("table", {}, el("thead", {}, el("tr", {}, rows[0].map((c) => el("th", {}, inline(c))))),
                    el("tbody", {}, rows.slice(1).map((r) => el("tr", {}, r.map((c) => el("td", {}, inline(c))))))));
    } else if (/^[-*]\s/.test(lines[0])) {
      const items = [];
      for (const line of lines) {
        if (/^[-*]\s/.test(line)) items.push(line.replace(/^[-*]\s+/, ""));
        else items[items.length - 1] += " " + line.trim();
      }
      nodes.push(el("ul", {}, items.map((item) => el("li", {}, inline(item)))));
    } else {
      nodes.push(el("p", {}, inline(lines.map((l) => l.trim()).join(" "))));
    }
  }
  return nodes;
}

// ---------- rendering ----------
function taskTitle(task) {
  return el("p", {class: "title"}, el("code", {}, task.id), " · ", task.kind);
}

function renderRun(trace) {
  const task = trace.task;
  const toolNames = {};
  const items = [];
  // messages: the earlier turns, then the request, then the run itself
  for (const message of trace.messages.slice(task.history.length + 1)) {
    if (message.role === "user" && typeof message.content === "string") {
      items.push(el("div", {class: "turn sim"}, el("div", {class: "who"}, "Simulated user"),
                    el("div", {class: "text"}, message.content)));
      continue;
    }
    const blocks = typeof message.content === "string" ? [{type: "text", text: message.content}] : message.content;
    if (message.role === "assistant") {
      const parts = [];
      for (const block of blocks) {
        if (block.type === "thinking") {
          parts.push(el("details", {class: "reasoning"},
                        el("summary", {}, `Reasoning (${words(block.thinking)} words)`),
                        el("div", {class: "text muted"}, block.thinking)));
        } else if (block.type === "text") {
          parts.push(el("div", {class: "text"}, block.text));
        } else if (block.type === "tool_use") {
          toolNames[block.id] = block.name;
          parts.push(el("div", {class: "call"}, "→ calls ", el("span", {class: "name"}, block.name),
                        el("pre", {}, pretty(block.input))));
        }
      }
      items.push(el("div", {class: "turn"}, el("div", {class: "who"}, "Agent"), parts));
    } else {
      for (const block of blocks) {
        if (block.type !== "tool_result") continue;
        const content = Array.isArray(block.content) ? block.content.map((c) => c.text ?? pretty(c)).join("\n") : String(block.content);
        items.push(el("div", {class: `turn tool-result${block.is_error ? " is-error" : ""}`},
                      el("div", {class: "who"}, `Result of ${toolNames[block.tool_use_id] || "a tool call"}`,
                         block.is_error ? el("span", {class: "badge error"}, "error") : null),
                      el("pre", {}, prettyOutput(content))));
      }
    }
  }
  return items;
}

function renderChanges(changes) {
  const rows = [];
  for (const [agent, fields] of Object.entries(changes.registry)) {
    for (const [field, [before, after]] of Object.entries(fields)) {
      rows.push(el("div", {class: "change"}, `${agent}.${field}: `, pretty(before), " → ", pretty(after)));
    }
  }
  for (const email of changes.outbox) {
    rows.push(el("div", {class: "turn"}, el("div", {class: "who"}, "Email sent"),
                 el("div", {}, el("strong", {}, "To: "), email.to),
                 el("div", {class: "text"}, email.body)));
  }
  return rows.length ? rows : [el("p", {class: "muted"}, "Nothing changed: no registry field changed and no email was sent.")];
}

function renderReference(trace, id) {
  const box = el("div", {});
  const show = () => {
    const label = labelFor(id);
    label.reference_viewed = true; save();
    const ref = trace.task.reference;
    box.replaceChildren(
      el("div", {class: "field"}, el("strong", {}, "Reference answer: "),
         ref.answer == null ? el("span", {class: "muted"}, "none (the task has no fixed answer)") : el("span", {class: "text"}, ref.answer)),
      el("div", {class: "field"}, el("strong", {}, "Notes: "),
         ref.notes == null ? el("span", {class: "muted"}, "none") : el("span", {class: "text"}, ref.notes)),
      el("p", {class: "muted"}, "Recorded: you viewed the reference for this trace."));
  };
  if (labelFor(id).reference_viewed) show();
  else box.append(el("button", {onclick: show}, "Show reference"),
                  el("span", {class: "muted"}, "  Form your own view first; viewing it is recorded."));
  return box;
}

function renderForm(id) {
  const label = labelFor(id);
  const status = el("span", {class: "status"});
  const reqNote = el("span", {class: "req"});
  const faultReq = el("span", {class: "req"});
  const faultHelp = el("div", {class: "fault-help muted"});
  const update = () => {
    const gaps = missing(label);
    status.className = `status ${gaps.length ? "todo" : "done"}`;
    status.textContent = gaps.length ? `Still needed: ${gaps.join(", ")}` : "Labelled";
    if (reader === REVIEW) status.textContent += changedFromFirst(id) ? " · changed from your first label" : " · same as your first label";
    faultHelp.textContent = label.fault ? `${FAULT_NAMES[label.fault]}: ${FAULT_HELP[label.fault]}` : "";
    const needed = label.verdict && label.verdict !== "pass";
    reqNote.textContent = needed ? " required" : " for fail and unsure";
    faultReq.textContent = needed ? " required" : " for fail and unsure";
    renderProgress();
    save();
  };
  const radios = (name, values, names, key) => values.map((value) =>
    el("label", {class: "opt", title: key === "fault" ? FAULT_HELP[value] : null},
       el("input", {type: "radio", name, value, checked: label[key] === value,
                    onchange: () => { label[key] = value; update(); }}),
       names ? names[value] : value));
  const text = (key, placeholder) => {
    const area = el("textarea", {placeholder, oninput: () => { label[key] = area.value; update(); }});
    area.value = label[key] || "";
    return area;
  };
  const form = el("form", {class: "card", onsubmit: (e) => e.preventDefault()},
    el("h2", {}, reader === REVIEW ? "Your label (re-review: prefilled from your first label)" : "Your label"),
    el("div", {class: "field"}, el("span", {class: "lbl"}, "Verdict ", el("span", {class: "req"}, "required")),
       radios("verdict", VERDICTS, null, "verdict")),
    el("div", {class: "field"}, el("span", {class: "lbl"}, "The first thing that went wrong", reqNote),
       text("first_failure", "Specific enough that someone else could find it")),
    el("div", {class: "field"}, el("span", {class: "lbl"}, "Whose fault", faultReq),
       radios("fault", FAULTS, FAULT_NAMES, "fault"),
       el("button", {type: "button", onclick: () => { label.fault = null; form.querySelectorAll("input[name=fault]").forEach((r) => r.checked = false); update(); }}, "clear"),
       faultHelp),
    el("div", {class: "field"}, el("span", {class: "lbl"}, "How it got there ", el("span", {class: "req muted"}, "optional")),
       text("how", "From its reasoning or its steps; including a pass that got there by luck or for the wrong reason")),
    el("div", {class: "nav"},
       el("button", {type: "button", disabled: index === 0, onclick: () => go(index - 1)}, "← Previous"),
       el("button", {type: "button", class: "primary", disabled: index === order().length - 1, onclick: () => go(index + 1)}, "Next →"),
       status));
  update();
  return form;
}

function renderTrace() {
  const id = currentId();
  const trace = traces[id];
  const task = trace.task;
  const groups = task.groups && [...task.groups].sort().join() !== DEFAULT_GROUPS.join() ? task.groups : null;
  const view = document.getElementById("trace");
  document.getElementById("guide").hidden = index !== 0;

  const head = el("div", {class: "card"}, taskTitle(task),
    el("div", {class: "meta"},
       task.faults.map((f) => el("span", {class: "chip fault"}, `injected fault: ${FAULT_TEXT[f] || f}`)),
       groups && el("span", {class: "chip"}, `reader groups: ${groups.join(", ")}`)));

  const request = el("div", {class: "card"}, el("h2", {}, task.history.length ? "The conversation so far, then the request" : "The request"),
    task.history.map((m) => el("div", {class: `turn ${m.role === "user" ? "user" : ""}`},
                               el("div", {class: "who"}, m.role === "user" ? "User" : "Agent"),
                               el("div", {class: "text"}, typeof m.content === "string" ? m.content : pretty(m.content)))),
    el("div", {class: "turn user"}, el("div", {class: "who"}, "User"), el("div", {class: "text"}, task.request)));

  const persona = task.persona && el("details", {class: "card"},
    el("summary", {}, "What the simulated user was told"), el("p", {class: "text"}, task.persona));

  const answer = trace.answers.length ? trace.answers[trace.answers.length - 1] : null;
  view.replaceChildren(
    head, request, persona || "",
    el("div", {class: "card"}, el("h2", {}, "The run"),
       el("div", {class: "nav"},
          el("button", {type: "button", onclick: () => view.querySelectorAll("details.reasoning").forEach((d) => d.open = true)}, "Expand all reasoning"),
          el("button", {type: "button", onclick: () => view.querySelectorAll("details.reasoning").forEach((d) => d.open = false)}, "Collapse all")),
       renderRun(trace)),
    el("div", {class: "card"}, el("h2", {}, "The final answer"),
       answer == null ? el("p", {class: "muted"}, "The agent gave no answer.") : el("div", {class: "text"}, answer)),
    el("div", {class: "card"}, el("h2", {}, "What changed in the world"), renderChanges(trace.changes)),
    el("div", {class: "card"}, el("h2", {}, "Reference"), renderReference(trace, id)),
    renderForm(id));
}

function renderProgress() {
  const done = order().filter(isDone).length;
  document.getElementById("progress").textContent = `${index + 1} of ${order().length} · ${done} labelled`;
}

function go(next) {
  flushTime();
  index = Math.max(0, Math.min(order().length - 1, next));
  save();
  renderTrace();
  renderProgress();
  window.scrollTo(0, 0);
  startTime();
}

function chooseReader(name) {
  if (reader) flushTime();
  reader = name || null;
  if (reader === REVIEW && !firstLabels) reader = null;
  document.getElementById("reader").value = reader || "";
  document.getElementById("export").disabled = !reader;
  store.set("labeller:reader", reader);
  if (!reader) {
    shownAt = null;
    document.getElementById("trace").replaceChildren(el("p", {class: "muted"}, "Choose a reader to start."));
    document.getElementById("progress").textContent = "";
    document.getElementById("guide").hidden = false;
    return;
  }
  labels = store.get(labelsKey()) || {};
  if (reader === REVIEW) { prefillFromFirst(); save(); }
  const saved = store.get(indexKey());
  index = Number.isInteger(saved) && saved >= 0 && saved < order().length ? saved : 0;
  renderTrace();
  renderProgress();
  startTime();
}

// ---------- the judge mode (Module 7, Lesson 7): one judge item at a time, blind ----------
const MODE = new URLSearchParams(location.search).get("mode");
const JUDGE_MODE = MODE === "judges" || MODE === "judges-relabel" ? MODE : null;
const JUDGE_DATA = "/public/data/eval/judge-labels/items.json";
const JUDGE_VERDICTS = ["pass", "fail", "unclear"];
const KIND_NAMES = {
  false_report: "Did the reply claim a change that didn't happen?",
  planted: "Did the reply pass on the planted instruction?",
  broken_result: "Did the reply state something from the empty record as fact?",
  correctness: "Does the answer match the reference answer?",
  relevance: "Does the answer address the question asked?",
  premise: "Did the reply handle the question's assumption correctly?",
};
// the first labelling's finished date, kept on its own so the relabel pass can warn without loading any label
const FIRST_FINISHED_KEY = "judges:first:finished";

let judgeFile = null, judgeOrder = [], judgeItems = {}, judgeIndex = 0, judgeState = null;
const judgeRelabel = () => JUDGE_MODE === "judges-relabel";
const judgeKey = () => `judges:v${judgeFile.version}:${judgeRelabel() ? "relabel" : "first"}`;
const saveJudges = () => store.set(judgeKey(), {...judgeState, index: judgeIndex});
const judgeLabelled = () => judgeOrder.filter((id) => judgeState.labels[id] && judgeState.labels[id].verdict).length;

// a shuffle seeded by a string, so the relabel order is the same on every machine: cyrb53-style hashing of the
// seed into a mulberry32 generator, then Fisher-Yates
function seededShuffle(list, seed) {
  let h = 1779033703 ^ seed.length;
  for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  const random = () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function setJudgeVerdict(verdict) {
  const id = judgeOrder[judgeIndex];
  const label = judgeState.labels[id] ||= {verdict: null, note: "", labelled_at: null};
  // a key or button always sets the verdict, never clears it, so pressing a key twice can't lose a label
  label.verdict = verdict;
  label.labelled_at = new Date().toISOString();
  if (!judgeState.started) judgeState.started = label.labelled_at;
  const done = judgeLabelled() === judgeOrder.length;
  judgeState.finished = done ? (judgeState.finished || new Date().toISOString()) : null;
  if (!judgeRelabel()) store.set(FIRST_FINISHED_KEY, judgeState.finished);
  saveJudges();
  renderJudgeItem();
}

function goJudge(next) {
  judgeIndex = Math.max(0, Math.min(judgeOrder.length - 1, next));
  saveJudges();
  renderJudgeItem();
  window.scrollTo(0, 0);
}

function renderJudgeItem() {
  const id = judgeOrder[judgeIndex];
  const item = judgeItems[id];
  const label = judgeState.labels[id] || {verdict: null, note: ""};
  document.getElementById("progress").textContent = `${judgeIndex + 1} of ${judgeOrder.length} · ${judgeLabelled()} labelled`;
  const note = el("textarea", {placeholder: "Optional: useful wherever the rubric didn't settle the case", oninput: () => {
    const l = judgeState.labels[id] ||= {verdict: null, note: "", labelled_at: null};
    l.note = note.value; saveJudges();
  }});
  note.value = label.note || "";
  document.getElementById("trace").replaceChildren(
    el("div", {class: "card"}, el("p", {class: "title"}, KIND_NAMES[item.kind] || item.kind)),
    el("div", {class: "card"}, el("h2", {}, "The rubric"), el("pre", {class: "rubric"}, item.rubric)),
    el("div", {class: "card"}, el("h2", {}, "What the judge was shown"), el("pre", {class: "shown"}, item.shown)),
    el("div", {class: "card"}, el("h2", {}, "Your verdict"),
       el("div", {class: "verdicts"}, JUDGE_VERDICTS.map((v) =>
         el("button", {type: "button", class: label.verdict === v ? "chosen" : null, onclick: () => setJudgeVerdict(v)},
            v.toUpperCase(), el("kbd", {}, v[0])))),
       el("div", {class: "field"}, el("span", {class: "lbl"}, "Note ", el("span", {class: "req muted"}, "optional")), note),
       el("div", {class: "nav"},
          el("button", {type: "button", disabled: judgeIndex === 0, onclick: () => goJudge(judgeIndex - 1)}, "← Previous", el("kbd", {}, "←")),
          el("button", {type: "button", class: "primary", disabled: judgeIndex === judgeOrder.length - 1,
                        onclick: () => goJudge(judgeIndex + 1)}, "Next →", el("kbd", {}, "→")),
          el("span", {class: `status ${label.verdict ? "done" : "todo"}`}, label.verdict ? "Labelled" : "Not labelled yet"),
          judgeState.finished ? el("span", {class: "status done"}, ` · all ${judgeOrder.length} labelled: export when you're ready`) : null)));
}

function exportJudges() {
  const out = {labeller: "simar", started: judgeState.started || null, finished: judgeState.finished || null,
               labels: judgeOrder.filter((id) => judgeState.labels[id] && judgeState.labels[id].verdict).map((id) => {
                 const l = judgeState.labels[id];
                 return {item_id: id, verdict: l.verdict, note: (l.note || "").trim() || null, labelled_at: l.labelled_at};
               })};
  const blob = new Blob([JSON.stringify(out, null, 1) + "\n"], {type: "application/json"});
  const a = el("a", {href: URL.createObjectURL(blob), download: judgeRelabel() ? "labels-judges-simar-relabel.json" : "labels-judges-simar.json"});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function importJudges(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { alert("That file isn't JSON."); return; }
  if (!data || data.labeller !== "simar" || !Array.isArray(data.labels)) { alert("That isn't a judge labels file from this page."); return; }
  const known = new Set(judgeOrder);
  const unknown = data.labels.filter((l) => !known.has(l.item_id));
  if (unknown.length) { alert(`${unknown.length} of its labels are for items not in this pass (first: ${unknown[0].item_id}). Is it from the other pass?`); return; }
  const overwritten = data.labels.filter((l) => judgeState.labels[l.item_id] && judgeState.labels[l.item_id].verdict).length;
  if (overwritten && !confirm(`Importing replaces ${overwritten} label(s) already saved in this browser. Go ahead?`)) return;
  for (const l of data.labels) {
    judgeState.labels[l.item_id] = {verdict: JUDGE_VERDICTS.includes(l.verdict) ? l.verdict : null, note: l.note || "",
                                    labelled_at: l.labelled_at || null};
  }
  judgeState.started = judgeState.started || data.started || null;
  judgeState.finished = judgeLabelled() === judgeOrder.length ? (data.finished || new Date().toISOString()) : null;
  if (!judgeRelabel()) store.set(FIRST_FINISHED_KEY, judgeState.finished);
  const firstOpen = judgeOrder.findIndex((id) => !(judgeState.labels[id] && judgeState.labels[id].verdict));
  judgeIndex = firstOpen === -1 ? 0 : firstOpen;
  saveJudges();
  renderJudgeItem();
}

async function initJudges() {
  document.title = judgeRelabel() ? "Labelling the judges' items: relabel" : "Labelling the judges' items";
  document.querySelector("header h1").textContent = document.title;
  for (const id of ["reader", "guide-link"]) (document.getElementById(id).closest("label") || document.getElementById(id)).hidden = true;
  try {
    const response = await fetch(JUDGE_DATA);
    if (!response.ok) throw new Error(`${JUDGE_DATA}: ${response.status}`);
    judgeFile = await response.json();
  } catch (error) {
    document.getElementById("loading").textContent =
      `Couldn't load the items (${error.message}). Run "python -m http.server" from the repo root and open /scripts/eval/labeller/?mode=${JUDGE_MODE}.`;
    return;
  }
  document.getElementById("loading").remove();
  judgeItems = Object.fromEntries(judgeFile.items.map((item) => [item.item_id, item]));
  judgeOrder = judgeRelabel() ? seededShuffle(judgeFile.relabel, "relabel") : judgeFile.items.map((item) => item.item_id);
  const saved = store.get(judgeKey()) || {};
  judgeState = {started: saved.started || null, finished: saved.finished || null, labels: saved.labels || {}};
  judgeIndex = Number.isInteger(saved.index) && saved.index >= 0 && saved.index < judgeOrder.length ? saved.index : 0;

  const guide = document.getElementById("guide");
  guide.hidden = false;
  const intro = [el("p", {}, judgeFile.instructions)];
  if (judgeRelabel()) {
    intro.push(el("p", {class: "muted"}, `The relabelling pass: ${judgeOrder.length} items, in a new order. Nothing from the first labelling is shown.`));
    const finished = store.get(FIRST_FINISHED_KEY);
    const weeks = judgeFile.relabel_after_weeks || 3;
    const age = finished ? (Date.now() - Date.parse(finished)) / (7 * 24 * 3600 * 1000) : null;
    if (age != null && age < weeks) {
      intro.push(el("p", {class: "card warning"}, `The first labelling finished ${age < 1 ? "less than a week" : `${Math.floor(age)} week${Math.floor(age) === 1 ? "" : "s"}`} ago, `,
                    `on ${finished.slice(0, 10)}. The relabel is meant to wait at least ${weeks} weeks, so the first labels aren't remembered.`));
    }
  }
  guide.replaceChildren(...intro);

  const exportButton = document.getElementById("export"), importButton = document.getElementById("import");
  exportButton.disabled = importButton.disabled = false;
  exportButton.addEventListener("click", exportJudges);
  importButton.addEventListener("click", () => document.getElementById("import-file").click());
  document.getElementById("import-file").addEventListener("change", (e) => {
    const file = e.target.files[0]; e.target.value = "";
    if (file) importJudges(file);
  });
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || /^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName)) return;
    const verdict = {p: "pass", f: "fail", u: "unclear"}[e.key.toLowerCase()];
    if (verdict) { e.preventDefault(); setJudgeVerdict(verdict); }
    else if (e.key === "ArrowRight") { e.preventDefault(); goJudge(judgeIndex + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); goJudge(judgeIndex - 1); }
  });
  renderJudgeItem();
}

if (!JUDGE_MODE) {
  document.getElementById("reader").addEventListener("change", (e) => chooseReader(e.target.value));
  document.getElementById("export").addEventListener("click", exportFile);
  document.getElementById("import").addEventListener("click", () => document.getElementById("import-file").click());
  document.getElementById("import-file").addEventListener("change", (e) => {
    const file = e.target.files[0]; e.target.value = "";
    if (file) importFile(file);
  });
  document.getElementById("guide-link").addEventListener("click", (e) => {
    e.preventDefault();
    const guide = document.getElementById("guide");
    guide.hidden = false; guide.scrollIntoView({behavior: "smooth"});
  });
}

(async () => {
  if (JUDGE_MODE) return initJudges();
  try {
    [sample, traces] = await Promise.all(["sample.json", "traces.json"].map(async (name) => {
      const response = await fetch(DATA + name);
      if (!response.ok) throw new Error(`${DATA + name}: ${response.status}`);
      return response.json();
    }));
  } catch (error) {
    document.getElementById("loading").textContent =
      `Couldn't load the sample (${error.message}). Run "python -m http.server" from the repo root and open /scripts/eval/labeller/.`;
    return;
  }
  document.getElementById("loading").remove();
  document.getElementById("import").disabled = false;
  const guide = document.getElementById("guide");
  try {
    const response = await fetch(DATA + "standard.md");
    if (!response.ok) throw new Error(response.status);
    guide.replaceChildren(...renderMarkdown(await response.text()));
  } catch (error) {
    guide.replaceChildren(el("p", {class: "muted"}, `Couldn't load the reading standard (${DATA}standard.md).`));
  }
  try {
    const response = await fetch(DATA + "labels-simar.json");
    if (!response.ok) throw new Error(response.status);
    firstLabels = Object.fromEntries((await response.json()).labels.map((l) => [l.trial_id, l]));
    document.querySelector(`#reader option[value=${REVIEW}]`).disabled = false;
  } catch { /* no first labels: the re-review pass stays unavailable */ }
  chooseReader(store.get("labeller:reader") || "");
})();
</script>
